# Port 80: the bot entry point. Expose this one through your reverse proxy.
<VirtualHost *:80>
    DocumentRoot /var/www/html
    Alias /llms.txt /var/www/html/index.php
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log noquery
</VirtualHost>

# Port 8080: the admin panel. A separate site with its own document root,
# so nothing of it can be reached through port 80. Keep it on your LAN.
Listen 8080
<VirtualHost *:8080>
    DocumentRoot /var/www/admin
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log noquery
</VirtualHost>
