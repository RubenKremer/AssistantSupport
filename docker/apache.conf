# Log the path (%U) but not the query string, so ?pass=... is never written to a log.
LogFormat "%h %l %u %t \"%m %U %H\" %>s %b" noquery

ServerName localhost
ServerTokens Prod
ServerSignature Off

# Fonts never change between builds; let browsers cache them for a year.
<LocationMatch "^/fonts/.+\.woff2$">
    Header set Cache-Control "public, max-age=31536000, immutable"
</LocationMatch>

# Only index.php and the fonts are served; there are no other files to browse.
<Directory /var/www/html>
    Options -Indexes
    AllowOverride None
</Directory>
<Directory /var/www/admin>
    Options -Indexes
    AllowOverride None
</Directory>
