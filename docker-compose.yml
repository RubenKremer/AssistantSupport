services:
  assistant-support:
    build: .
    image: assistant-support:latest
    container_name: assistant-support
    restart: unless-stopped
    ports:
      - "8080:80"     # bot entry point: put this behind your reverse proxy
      - "8081:8080"   # admin panel: keep this on your local network
    environment:
      - PUID=99
      - PGID=100
      - TZ=Europe/Amsterdam
      # Required for the admin panel. Put it in a .env file next to this one.
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
    volumes:
      - ./appdata/data:/data
      - ./appdata/config:/config
